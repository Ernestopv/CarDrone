# Serves the built SPA and forwards API traffic to the compose backend
# service. The proxy target is the compose service DNS name — no host
# assumptions anywhere (specs/docker/full-stack-compose.md).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Task 32 (specs/docker/ustreamer-container.md): media-plane stream
    # location, rendered at container start by
    # docker-entrypoint.d/50-camera-location.sh from CAMERA_PROXY_TARGET.
    # Empty -> 404 (never the SPA fallback); set -> byte passthrough to the
    # uStreamer MJPEG endpoint. Longest-prefix matching always routes
    # /camera/... here before the SPA fallback below.
    include /etc/nginx/locations/camera.conf;

    # Single-page app: unknown paths fall back to the shell document.
    location / {
        try_files $uri /index.html;
    }
}
