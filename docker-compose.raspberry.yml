# Pi-only configuration overlay, selected from the target Pi's root .env via
# COMPOSE_FILE. It merges the existing services; it does not add a second
# control service.
#
# Compose cannot conditionally omit a service's `devices`/`group_add` lists
# based on an env variable, so concrete mappings are added here ONLY from
# target evidence (docs/hardware/raspberry-pi-inventory.md) — never invented,
# never `privileged: true`. `:?` makes a missing required value fail with the
# named message instead of silently leaking an empty device path.
services:
  # GPIO: real-mode backend uses the Linux GPIO character device
  # (Raspberry:GPIO:ChipPath). Target evidence (Raspberry Pi 4 / Ubuntu 22.04):
  #   - gpiochip0 [pinctrl-bcm2711] (58 lines) = 40-pin header bank
  #   - host group gpio GID 997 + udev rule giving /dev/gpiochip0 mode 0660
  #     (SUBSYSTEM=="gpio", KERNEL=="gpiochip0", GROUP="gpio", MODE="0660")
  #   - container path matches GPIO_DEVICE (default /dev/gpiochip0)
  backend:
    devices:
      - "${GPIO_DEVICE:?set GPIO_DEVICE from the target inventory}:/dev/gpiochip0"
    group_add:
      - "${GPIO_GID:?set GPIO_GID from the target inventory}"
    # Motor direction mapping lives in the operator's ./motor.env (not in the
    # repo): keys MotorMapping__DirectionMappingVerified and
    # MotorMapping__Commands__<cmd>__Pin1..Pin4 = HIGH/LOW. Optional file.
    env_file:
      - path: ./motor.env
        required: false
    # NOTE (verified on the target): PWM is a sysfs interface and an
    # unprivileged container cannot write it — Docker mounts /sys read-only and
    # a bind mount of the chip tree (or all /sys) still returns EROFS. Speed
    # control via in-container sysfs is therefore deferred; direction control
    # works over the GPIO character device. For bench work, enable ENA/ENB from
    # the host (see docs/RUNBOOK-PI.md) or use the L298N jumpers.
  # uStreamer camera: mapping APPROVED by the completed target inventory
  # (docs/hardware/raspberry-pi-inventory.md, "Approved Docker mapping"):
  # capture node /dev/video0 (group video, GID 44) for the non-root ustreamer
  # container.
  ustreamer:
    devices:
      - "/dev/video0:/dev/video0"
    group_add:
      - "44"