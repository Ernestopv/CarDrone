# Pi-only configuration overlay, selected from the target Pi's root .env via
# COMPOSE_FILE. It merges the existing services; it does not add a second
# control service.
#
# Compose cannot conditionally omit a service's `devices`/`group_add` lists
# based on an env variable, so concrete mappings are added here ONLY from
# target evidence (docs/hardware/raspberry-pi-inventory.md) — never invented,
# never `privileged: true`. `:?` makes a missing required value fail with the
# named message instead of silently leaking an empty device path.
services:
  # GPIO: real-mode backend uses the Linux GPIO character device
  # (Raspberry:GPIO:ChipPath). Target evidence (Raspberry Pi 4 / Ubuntu 22.04):
  #   - gpiochip0 [pinctrl-bcm2711] (58 lines) = 40-pin header bank
  #   - host group gpio GID 997 + udev rule giving /dev/gpiochip0 mode 0660
  #     (SUBSYSTEM=="gpio", KERNEL=="gpiochip0", GROUP="gpio", MODE="0660")
  #   - container path matches GPIO_DEVICE (default /dev/gpiochip0)
  backend:
    devices:
      - "${GPIO_DEVICE:?set GPIO_DEVICE from the target inventory}:/dev/gpiochip0"
      # Battery (Task 41, specs/hardware/battery-monitoring.md): /dev/i2c-1 is
      # already group-writable on the target (crw-rw---- root i2c, group i2c
      # GID 119 — inventory "I2C"), so gid 119 in group_add grants the non-root
      # app user access with NO host udev change. Values are operator evidence.
      - "${I2C_DEVICE:?set I2C_DEVICE from the target inventory}:/dev/i2c-1"
    group_add:
      - "${GPIO_GID:?set GPIO_GID from the target inventory}"
      - "${I2C_GID:?set I2C_GID from the target inventory}"
    # PWM speed: bind-mount the PWM sysfs chip tree. The target is /pwm — a
    # path OUTSIDE /sys, because Docker keeps /sys read-only and a bind mount
    # whose target is inside /sys is also read-only (verified on the target). At
    # /pwm the non-root app user CAN write it (the host files are a+rw).
    # Chip/channel values come from .env (PWM_CHIP_PATH = host source,
    # PWM_CHANNEL_12/13); the asserted duty envelope from ./pwm.env.
    volumes:
      - "${PWM_CHIP_PATH:-/sys/class/pwm/pwmchip0}:/pwm"
    environment:
      # Point the real PWM sink at the bind-mounted tree.
      Raspberry__PWM__ChipPath: /pwm
    # Operator mappings (never in the repo): motor direction in ./motor.env and
    # the PWM envelope in ./pwm.env. Optional files.
    env_file:
      - path: ./motor.env
        required: false
      - path: ./pwm.env
        required: false
  # uStreamer camera: mapping APPROVED by the completed target inventory
  # (docs/hardware/raspberry-pi-inventory.md, "Approved Docker mapping"):
  # capture node /dev/video0 (group video, GID 44) for the non-root ustreamer
  # container.
  ustreamer:
    devices:
      - "/dev/video0:/dev/video0"
    group_add:
      - "44"
    # Publish the MJPEG endpoint on the host loopback only, so the host-networked
    # go2rtc service (WebRTC) can read it. Never on the LAN: the media plane
    # stays behind the frontend nginx /camera/ passthrough.
    ports:
      - "127.0.0.1:8080:8080"