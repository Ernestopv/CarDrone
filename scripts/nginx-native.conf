# CarDrone — nginx nativo (sin Docker). Plantilla; scripts/run-native-pi.sh
# sustituye __HTTP_PORT__, __BACKEND_PORT__, __USTREAMER_PORT__,
# __GO2RTC_API_PORT__ y __WWW_ROOT__.
server {
    listen __HTTP_PORT__;
    server_name _;

    root __WWW_ROOT__;
    index index.html;

    # Control plane: same-origin /api/ → backend ASP.NET (127.0.0.1).
    location /api/ {
        proxy_pass http://127.0.0.1:__BACKEND_PORT__;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Media plane: same-origin /camera/ → uStreamer MJPEG (127.0.0.1).
    location /camera/ {
        proxy_pass http://127.0.0.1:__USTREAMER_PORT__/stream;
        proxy_set_header Host $host;
        postpone_output 0;
        proxy_buffering off;
        proxy_ignore_headers X-Accel-Buffering;
        # Low-latency MJPEG: no Nagle coalescing on the media socket.
        tcp_nodelay on;
        proxy_read_timeout 60s;
    }

    # WebRTC signaling for go2rtc (same-origin). The media itself flows directly
    # to the Pi on UDP/TCP 8555; only the SDP offer/answer goes through nginx.
    location /go2rtc/ {
        proxy_pass http://127.0.0.1:__GO2RTC_API_PORT__/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback.
    location / {
        try_files $uri /index.html;
    }
}
